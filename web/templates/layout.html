<!DOCTYPE html>
<html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X70EJ3NGL3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-X70EJ3NGL3');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The UI is dark-only, so let the browser paint form controls and
       scrollbars to match. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1013">
  <title>Gingerbread</title>
  <link rel="stylesheet" href="./styles/styles.css">
  <script defer type="text/javascript" src="./scripts/bulma.js"></script>
</head>

<body>

  <section class="hero is-fullheight is-primary" x-data="app" @designloaded.window="designloaded"
    @designerror.window="designerror" @dragging.window="dragged">
    <div class="hero-head">
      <nav class="navbar is-primary">
        <div class="container">
          <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
              <span class="gb-brand-mark">
                <span class="material-symbols-outlined">cookie</span>
              </span>
              Gingerbread
            </a>
            <span class="navbar-burger" data-target="navbarMenuHeroA">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </div>
          <div id="navbarMenuHeroA" class="navbar-menu">
            <div class="navbar-start">
            </div>
            <div class="navbar-end">
              {% block navbar_items %}{% endblock %}
              <a class="navbar-item" href="help.html">
                <span class="is-hidden-touch">
                  <span class="material-symbols-outlined">
                    help
                  </span>
                </span>
                <span class="is-hidden-desktop">
                  <span class="icon-text">
                    <span class="icon material-symbols-outlined">
                      help
                    </span>
                    <span>Help</span>
                  </span>
                </span>
              </a>
              <a class="navbar-item" href="https://github.com/carlosedp/Gingerbread" target="_blank">
                <span class="is-hidden-touch">
                  <img alt="GitHub" src="./images/github.png" />
                </span>
                <span class="is-hidden-desktop">
                  <span class="icon-text">
                    <span class="icon">
                      <img alt="GitHub" src="./images/github.png" />
                    </span>
                    <span class="is-hidden-desktop">GitHub</span>
                  </span>
                </span>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </div>

    {% block body %}{% endblock %}

  </section>

  {% block scripts %}{% endblock %}
</body>

</html>
